# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: UHD ACM chatbot agent eval

# The provider builds the real prompt itself (same path as production:
# processQuery -> buildHumanMessage -> agent). This passthrough exists only
# because promptfoo requires a prompt; its value is not used.
prompts:
  - '{{query}}'

providers:
  - id: file://./provider.ts
    label: agent-gemini-2.5-flash

# One test per golden, with assertions derived from each golden's grading specs.
tests: file://./tests.ts

defaultTest:
  options:
    # The judge must not be the gemini-2.5-flash system under test, or it grades
    # its own output class. gemini-flash-latest is a different generation, so
    # that separation holds without the pro tier's 250 requests/day/project cap
    # — one full suite is ~113 judge calls, so pro-tier grading collapses into
    # timeouts after roughly two runs in a day.
    #
    # run.ts passes --grader explicitly and is the source of truth; this value
    # is the fallback for invoking promptfoo directly. `npm run eval:pro` grades
    # with the pro tier for a final sign-off when quota allows.
    # (gemini-2.5-pro is listed by the API but 404s for this account:
    # "no longer available to new users". Verified still true.)
    provider: google:gemini-flash-latest

    # The provider returns an object, but promptfoo hands assertions a JSON
    # string. Without this, every per-assertion transform below (output.response,
    # output.trace...) silently reads undefined and the rubrics grade nothing.
    transform: 'typeof output === "string" ? JSON.parse(output) : output'

  # Deterministic invariants applied to every case. No judge calls, no cost, and
  # they cover what a rubric cannot check reliably.
  assert:
    - type: javascript
      value: file://./invariants.ts:noRawToolOutput
      metric: no-raw-output
    - type: javascript
      value: file://./invariants.ts:noRawUrlInResponse
      metric: no-raw-url
    - type: javascript
      value: file://./invariants.ts:actionsAreGrounded
      metric: grounded-links
    - type: javascript
      value: file://./invariants.ts:rendersInSupportedMarkdown
      metric: markdown-supported
    - type: javascript
      value: file://./invariants.ts:answerFitsBubble
      metric: answer-length
    - type: javascript
      value: file://./invariants.ts:respectsSchemaLimits
      metric: schema-limits
